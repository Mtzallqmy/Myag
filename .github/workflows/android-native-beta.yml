name: Native Android Beta
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android-native-beta.yml"]
  push:
    branches: [migration/android-native-botkeep]
    paths: ["apps/android/**", ".github/workflows/android-native-beta.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Kotlin tests, lint and installable beta APK
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - name: Verify manifest, signing and native libraries
        run: |
          mkdir -p beta-output
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee beta-output/apk-signature.txt
          # Default API 26 verification chooses v2; explicitly check JAR signing too.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 21 --verbose "$APK" | tee beta-output/apk-legacy-signature.txt
          grep 'Verified using v1 scheme (JAR signing): true' beta-output/apk-legacy-signature.txt
          grep 'Verified using v2 scheme (APK Signature Scheme v2): true' beta-output/apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > beta-output/apk-manifest.txt
          grep "package: name='com.wakeel.app.beta4'" beta-output/apk-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          grep "sdkVersion:'26'" beta-output/apk-manifest.txt
          grep "targetSdkVersion:'36'" beta-output/apk-manifest.txt
          python - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              libs = [p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')]
              assert all(p.startswith('lib/arm64-v8a/') for p in libs), libs
              assert 'classes.dex' in apk.namelist()
              print('ARM64 compatible; native libraries:', libs)
          PY
          cp "$APK" beta-output/wakeel-0.1.0-beta.4-arm64-compatible.apk
          cd beta-output
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wakeel-native-beta
          path: |
            beta-output/*
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
      - name: Publish tester prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=wakeel-android-v0.1.0-beta.4
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing prerelease retained. New build is available as an Actions artifact.'
          else
            gh release create "$TAG" beta-output/* --target "$GITHUB_SHA" --prerelease --title "وكيل Android 0.1.0 Beta 4" --notes-file apps/android/BETA_NOTES.md
          fi
